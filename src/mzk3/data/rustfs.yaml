---
# RustFS (https://github.com/rustfs/rustfs) as the S3-compatible blob storage
# backend for Materialize persist.
#
# Credentials are set to minio/minio123 to match the persist_backend_url
# credentials baked into the upstream Materialize CR; mzk3 repoints only the
# endpoint host (minio -> rustfs) so those credentials still line up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: materialize
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        # RustFS image runs as uid/gid 10001; make the emptyDir writable.
        fsGroup: 10001
      containers:
      - name: rustfs
        image: rustfs/rustfs:latest
        args:
        - /data
        env:
        - name: RUSTFS_ACCESS_KEY
          value: "minio"
        - name: RUSTFS_SECRET_KEY
          value: "minio123"
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "false"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: materialize
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: rustfs
---
# RustFS has no built-in bucket bootstrap, so create the persist buckets with a
# one-shot Job once RustFS is reachable, using the (S3-generic) MinIO client.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-createbuckets
  namespace: materialize
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: createbuckets
        image: minio/mc
        command:
        - /bin/sh
        - -c
        - |
          set -e
          until mc alias set rfs http://rustfs.materialize.svc.cluster.local:9000 minio minio123; do
            echo "waiting for rustfs..."
            sleep 2
          done
          mc mb -p rfs/bucket
          mc mb -p rfs/persist
          mc mb -p rfs/thanos
          echo "buckets ready"
