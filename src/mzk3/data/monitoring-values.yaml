prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      # Standard pod scraping (environmentd, balancerd)
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            regex: 'true'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: replace
            regex: '(https?)'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: '(.+)'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: '__meta_kubernetes_pod_annotation_prometheus_io_param_(.+)'
            replacement: __param_$1
          - action: labelmap
            regex: '__meta_kubernetes_pod_label_(.+)'
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name
          - action: drop
            regex: 'Pending|Succeeded|Failed|Completed'
            source_labels:
              - __meta_kubernetes_pod_phase
      # Clusterd compute metrics
      - job_name: kubernetes-pods-mz-compute
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            regex: 'true'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: replace
            regex: '(https?)'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: '(.+)'
            source_labels:
              - __meta_kubernetes_pod_annotation_materialize_prometheus_io_mz_compute_path
            target_label: __metrics_path__
          - action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: '__meta_kubernetes_pod_annotation_prometheus_io_param_(.+)'
            replacement: __param_$1
          - action: labelmap
            regex: '__meta_kubernetes_pod_label_(.+)'
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name
          - action: drop
            regex: 'Pending|Succeeded|Failed|Completed'
            source_labels:
              - __meta_kubernetes_pod_phase
      # Clusterd storage metrics
      - job_name: kubernetes-pods-mz-storage
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            regex: 'true'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: replace
            regex: '(https?)'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: '(.+)'
            source_labels:
              - __meta_kubernetes_pod_annotation_materialize_prometheus_io_mz_storage_path
            target_label: __metrics_path__
          - action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: '__meta_kubernetes_pod_annotation_prometheus_io_param_(.+)'
            replacement: __param_$1
          - action: labelmap
            regex: '__meta_kubernetes_pod_label_(.+)'
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name
          - action: drop
            regex: 'Pending|Succeeded|Failed|Completed'
            source_labels:
              - __meta_kubernetes_pod_phase
      # Usage metrics
      - job_name: kubernetes-pods-mz-usage
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            regex: 'true'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: replace
            regex: '(https?)'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: '(.+)'
            source_labels:
              - __meta_kubernetes_pod_annotation_materialize_prometheus_io_mz_usage_path
            target_label: __metrics_path__
          - action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: '__meta_kubernetes_pod_annotation_prometheus_io_param_(.+)'
            replacement: __param_$1
          - action: labelmap
            regex: '__meta_kubernetes_pod_label_(.+)'
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: kubernetes_namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: kubernetes_pod_name
          - action: drop
            regex: 'Pending|Succeeded|Failed|Completed'
            source_labels:
              - __meta_kubernetes_pod_phase
      # NOTE: kubelet-cadvisor metrics (container_spec_memory_limit_bytes, etc.)
      # are NOT available on k3d/kind running on macOS due to nested container
      # virtualization. These metrics work on native Linux deployments.
grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
alertmanager:
  enabled: false
