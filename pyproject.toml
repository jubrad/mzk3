[project]
name = "mzk3"
version = "0.1.0"
description = "Deploy and manage Materialize on a K3s/k3d Kubernetes cluster"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mzk3 = "mzk3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mzk3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "integration: spins up a real k3d cluster and installs Materialize (slow, needs docker/k3d/kubectl/helm + network)",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
